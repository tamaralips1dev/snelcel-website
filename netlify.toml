# Alleen headers. De build command (python3 bouw.py) en de publicatiemap (site)
# blijven staan waar ze nu staan: in de Netlify-instellingen. Dit bestand
# overschrijft die niet.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/afbeeldingen/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/stijl.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
